<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>塗り重ね記録 — 北野塗装工業</title>
<style>
:root{
  color-scheme: light only;
  --bg:#E8EDF2; --card:#FFFFFF; --txt:#101418; --sub:#3A4450; --faint:#6A7380;
  --line:#C3CCD6; --line2:#E2E7ED;
  --navy:#163A63; --navybg:#E4EDF6;
  --ink:#101418;
  --red:#B42318; --redbg:#F8E8E6;
  --north:#163A63;
  --bar:#8A97A8;
  --navh:70px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:#E8EDF2;}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:"Noto Sans CJK JP","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  font-size:17px;line-height:1.7;word-break:auto-phrase;line-break:strict;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;line-height:1.4;}
button{font-family:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;}
.app{max-width:370px;margin:0 auto;min-height:100vh;position:relative;}
.pad{padding:18px 16px calc(var(--navh) + 28px);}
.scr{display:none;}
.scr.on{display:block;animation:fi .2s ease both;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hd{position:sticky;top:0;z-index:30;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line2);}
.hd .bk{font-size:28px;line-height:1;color:var(--sub);padding:0 8px 4px 0;margin-left:-4px;min-width:36px;}
.hd .t{font-size:18px;font-weight:700;flex:1;min-width:0;line-height:1.35;}
.hd .t small{display:block;font-size:13px;font-weight:600;color:var(--sub);}
.hd-tools{display:flex;align-items:center;gap:8px;flex:none;}
.hd .role{display:flex;align-items:center;gap:8px;border:1px solid var(--navy);border-radius:999px;
  padding:6px 12px 6px 6px;background:var(--navy);color:#fff;min-height:40px;}
.hd .role i{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--navy);
  font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.hd .role b{font-size:14px;color:#fff;}
.to-entry{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:700;color:var(--sub);min-height:36px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;}

/* 入口 */
#entry{display:flex;flex-direction:column;padding:28px 18px 22px;}
#entry h1{font-size:30px;letter-spacing:-.03em;margin-bottom:8px;line-height:1.25;}
#entry .lead{font-size:16px;color:var(--sub);margin:0 0 16px;line-height:1.65;}
.preview{
  flex:none;margin:0 0 16px;padding:10px 10px 12px;background:#1A222C;border-radius:16px;
  box-shadow:0 12px 28px rgba(16,20,24,.18);
}
.mini{background:var(--bg);border-radius:12px;overflow:hidden;pointer-events:none;}
.mini .mh{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line2);background:var(--bg);}
.mini .mh b{font-size:11px;display:block;line-height:1.3;}
.mini .mh span{display:block;font-size:8px;font-weight:600;color:var(--sub);}
.mini .mb{padding:8px;}
.mini .mm{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px;}
.mini .mm i{display:block;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-style:normal;}
.mini .mm i u{display:block;font-size:7px;color:var(--faint);text-decoration:none;font-weight:700;}
.mini .mm i em{display:block;font-size:10px;font-weight:700;font-style:normal;color:var(--txt);}
.mini .mp{position:relative;height:112px;border-radius:7px;overflow:hidden;background:#1A222C;margin-bottom:6px;}
.mini .mp img{display:block;width:100%;height:100%;object-fit:cover;}
.mini .mp::after{content:"";position:absolute;inset:16%;border:1px dashed rgba(255,255,255,.65);border-radius:3px;}
.mini .mj{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.mini .mj i{display:block;border-radius:7px;padding:8px 4px;text-align:center;font-size:8px;font-weight:700;font-style:normal;}
.mini .mj .w{background:var(--navy);color:#fff;}
.mini .mj .g{background:#fff;border:1px solid var(--line);color:var(--txt);}
.start{width:100%;min-height:72px;border-radius:14px;background:var(--navy);color:#fff;
  font-size:22px;font-weight:700;margin-bottom:14px;}
.start:active{transform:scale(.99);}
.sitefoot{margin:0;font-size:12px;color:var(--faint);font-weight:600;text-align:center;line-height:1.6;}

/* 面一覧 */
.banner{border-radius:12px;overflow:hidden;aspect-ratio:16/8;background:#D5DCE4;margin-bottom:14px;}
.banner img{display:block;width:100%;height:100%;object-fit:cover;}
.frow{display:flex;align-items:center;gap:14px;padding:14px 14px;border-bottom:1px solid var(--line2);
  width:100%;text-align:left;min-height:88px;}
.frow:last-child{border-bottom:none;}
.frow.today:active{background:#F4F7FA;}
.frow.off{opacity:.72;}
.fth{width:76px;height:52px;border-radius:8px;overflow:hidden;flex:none;background:#D5DCE4;}
.fth img{display:block;width:100%;height:100%;object-fit:cover;}
.frow .tx{flex:1;min-width:0;}
.frow .tx b{display:block;font-size:19px;}
.frow .tx small{display:block;font-size:13.5px;color:var(--sub);}
.pill{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:8px;flex:none;background:var(--navybg);color:var(--navy);}
.pill.mute{background:var(--line2);color:var(--faint);}

/* 数値 2x2 */
.metrics{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:4px;padding:4px 2px;white-space:nowrap;}
.metrics .m{background:none;border:0;padding:0;min-height:0;min-width:0;}
.metrics .m{min-width:0;}
.metrics .m span{display:block;font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.04em;}
.metrics .m span{display:inline;font-size:13px;letter-spacing:0;}
.metrics .m b{display:inline;font-size:18px;font-weight:800;margin:0;font-variant-numeric:tabular-nums;}
.standard{font-size:12px;color:var(--faint);font-weight:700;margin:0 0 12px;padding-left:2px;}

/* 似た条件 */
.sim{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;}
.sim > summary{list-style:none;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.sim > summary::-webkit-details-marker{display:none;}
.sim > summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin-top:-4px;}
.sim[open] > summary::after{transform:rotate(-135deg);margin-top:4px;}
.sim .body{padding:0 16px 16px;}
.sim .stats{display:flex;gap:8px;margin-bottom:12px;}
.sim .stats div{flex:1;background:#F4F7FA;border-radius:10px;padding:10px 8px;text-align:center;}
.sim .stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums;}
.sim .stats span{font-size:11.5px;color:var(--faint);font-weight:700;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.split .c{border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;}
.split .c b{display:block;font-size:16px;}
.split .c em{font-style:normal;display:block;font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;}

/* 過去記録を判断材料の主役にする */
.history{margin:0 0 14px;}
.history h3{font-size:16px;margin:0 0 8px;}
.history-list{display:grid;gap:8px;}
.history-card{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.history-card img{width:76px;height:100%;min-height:78px;object-fit:cover;}
.history-card .hc-body{padding:10px 10px 10px 0;min-width:0;}
.history-card .hc-meta{font-size:12px;color:var(--faint);font-weight:700;}
.history-card .hc-decision{font-size:15px;font-weight:800;margin:2px 0;}
.history-card .hc-decision.wait{color:var(--navy);}
.history-card .hc-decision.go{color:#8A5A00;}
.history-card p{font-size:13px;color:var(--sub);line-height:1.55;margin:0;}
.questions{display:grid;gap:10px;margin:0 0 14px;}
.question{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
.question h3{font-size:15px;margin:0 0 2px;line-height:1.45;}
.question small{display:block;font-size:11.5px;color:var(--faint);font-weight:700;margin-bottom:8px;}
.question .answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.question .answers button{border:1px solid var(--line);background:#F4F7FA;border-radius:9px;padding:10px 5px;font-size:14px;font-weight:700;min-height:42px;}
.question .answers button.sel{background:var(--navy);border-color:var(--navy);color:#fff;}
.filter-note{font-size:12px;color:var(--sub);line-height:1.5;margin:0 0 8px;}

/* 写真 */
.shot{position:relative;border-radius:12px;overflow:hidden;background:#1A222C;aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;margin-bottom:14px;width:100%;}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s;}
.shot.has img{opacity:1;}
.shot .guide{position:absolute;inset:14%;border:2px dashed rgba(255,255,255,.72);border-radius:6px;pointer-events:none;}
.shot.has .guide{opacity:.35;}

/* 録音 */
.micwrap{margin:4px 0 16px;text-align:center;}
.mic{width:100%;min-height:76px;border-radius:14px;background:var(--navy);color:#fff;
  font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;}
.mic.rec{background:var(--red);}
.mic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.said{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16.5px;line-height:1.75;margin:0 0 16px;text-align:left;}

/* 判断 */
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:calc(var(--navh) + 10px);padding-top:4px;}
.judge button{border-radius:14px;padding:22px 10px;font-size:19px;font-weight:700;min-height:76px;border:1px solid var(--line);background:var(--card);}
.judge .wait{background:var(--navy);color:#fff;border-color:var(--navy);}
.judge .go{background:var(--card);color:var(--txt);}
.judge button:disabled{background:#D5DCE4;color:#8A93A0;border-color:#D5DCE4;}

.done{text-align:center;padding:40px 12px 12px;}
.done h2{font-size:22px;margin-bottom:18px;}
.slot{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);text-align:left;}
.slot .k{width:88px;flex:none;font-size:13px;font-weight:700;color:var(--faint);padding-top:2px;}
.slot .v{font-size:16.5px;font-weight:600;flex:1;}
.slot .v.empty{color:var(--faint);font-weight:500;}
.back{display:block;width:100%;margin-top:22px;border-radius:14px;padding:18px;font-size:18px;font-weight:700;
  background:var(--navy);color:#fff;min-height:64px;}

/* 事務所 */
.kpi{display:flex;gap:10px;margin-bottom:16px;}
.kpi .k{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 14px;}
.kpi .k em{font-style:normal;display:block;font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;}
.kpi .k small{font-size:13px;color:var(--faint);display:block;margin-top:4px;font-weight:700;}
.kncard{padding:18px 18px 16px;margin-bottom:12px;}
.kncard .meta{display:flex;gap:10px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;}
.kncard .meta b{font-size:18px;}
.kncard .meta span{font-size:13px;color:var(--faint);font-weight:600;}
.kncard p{margin:0 0 12px;font-size:17px;line-height:1.75;font-weight:600;}
.kncard .ev{font-size:14.5px;color:var(--sub);border-top:1px solid var(--line2);padding-top:10px;line-height:1.7;}

.bars{padding:8px 0 4px;}
.bar{display:grid;grid-template-columns:48px 1fr 64px;gap:12px;align-items:center;margin-bottom:18px;}
.bar .nm{font-size:17px;font-weight:700;}
.bar .track{height:36px;background:var(--line2);border-radius:8px;overflow:hidden;min-width:0;}
.bar .fill{display:block;height:100%;background:var(--bar);border-radius:8px;}
.bar .hr{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}
.bar.north .nm,.bar.north .hr{color:var(--north);font-weight:800;}
.bar.north .fill{background:var(--north);}

.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);
  display:none;z-index:40;max-width:370px;margin:0 auto;}
.nav.on{display:flex;}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:12px;font-weight:700;color:var(--faint);height:var(--navh);}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.nav button.sel{color:var(--navy);}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

@media (prefers-color-scheme: dark){
  html,body,.app,.hd,.scr,#entry,.mini,.mini .mh{background:#E8EDF2 !important;color:#101418 !important;}
  .card,.nav,.judge .go,.said,.kpi .k,.kncard,.to-entry,.sim,.metrics .m,.mini .mm i,.mini .mj .g
  {background:#FFFFFF !important;color:#101418 !important;}
  h1,h2,.frow .tx b,.metrics .m b,.sim .stats b,.split .c em,.kncard p,.hd .t,.kpi .k em,#entry h1,.mini .mh b,.mini .mm i em
  {color:#101418 !important;}
  #entry .lead,.mini .mh span{color:#3A4450 !important;}
  .sitefoot,.mini .mm i u{color:#6A7380 !important;}
  .nav button.sel,.bar.north .nm,.bar.north .hr{color:#163A63 !important;}
  .judge .wait,.mic,.back,.start,.hd .role,.mini .mj .w{background:#163A63 !important;color:#fff !important;}
  .hd .role i{background:#FFFFFF !important;color:#163A63 !important;}
  .hd .role b{color:#FFFFFF !important;}
  .mic.rec{background:#B42318 !important;}
  .preview{background:#1A222C !important;}
}

@media (max-width:420px){
  .metrics .m b{font-size:16px;}
  .metrics .m span{font-size:11px;}
}

@media (min-width: 900px){
  body[data-view="entry"],
  body[data-view="phone"]{
    display:flex;justify-content:center;align-items:center;
    height:100vh;overflow:hidden;padding:28px 40px;background:#C5CED6;
  }
  body[data-view="entry"] .app{
    width:370px;max-width:370px;min-height:0;height:auto;
    max-height:min(780px, calc(100vh - 56px));
    border-radius:28px;overflow:auto;
    box-shadow:0 28px 64px rgba(16,20,24,.18), 0 0 0 1px rgba(16,20,24,.08);
    background:var(--bg);
  }
  body[data-view="phone"] .app{
    width:370px;max-width:370px;min-height:0;height:min(780px, calc(100vh - 56px));
    border-radius:28px;overflow:hidden;
    box-shadow:0 28px 64px rgba(16,20,24,.18), 0 0 0 1px rgba(16,20,24,.08);
    background:var(--bg);
  }
  body[data-view="phone"] .scr.on{display:flex;flex-direction:column;height:100%;min-height:0;overflow:auto;animation:none;}
  body[data-view="phone"] .hd{flex:none;}
  body[data-view="phone"] .nav{position:absolute;left:0;right:0;bottom:0;max-width:none;width:100%;}

  body[data-view="wide"]{
    height:100vh;overflow:hidden;background:var(--bg);
  }
  body[data-view="wide"] .app{
    width:100%;max-width:960px;margin:0 auto;height:100vh;
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }
  body[data-view="wide"] .scr.on{flex:1;min-height:0;overflow:auto;animation:none;display:flex;flex-direction:column;}
  body[data-view="wide"] .hd{flex:none;}
  body[data-view="wide"] .pad{padding:24px 28px calc(var(--navh) + 32px);}
  body[data-view="wide"] .nav{position:absolute;left:0;right:0;bottom:0;max-width:none;width:100%;}
  body[data-view="wide"] .kpi .k em{font-size:44px;}
  body[data-view="wide"] .bar{grid-template-columns:56px 1fr 72px;margin-bottom:22px;}
  body[data-view="wide"] .bar .track{height:44px;}
}
</style>
</head>
<body data-view="entry">
<div class="app">

<section class="scr on" id="s-entry">
  <div id="entry">
    <h1>塗り重ね記録</h1>
    <p class="lead">乾き具合の判断を残して、次の現場で使う</p>
    <div class="preview" aria-hidden="true">
      <div class="mini">
        <div class="mh"><b>南面 2階</b><span>中塗り → 上塗り</span></div>
        <div class="mb">
          <div class="mm">
            <i><u>気温</u><em>22℃</em></i>
            <i><u>湿度</u><em>68%</em></i>
            <i><u>素地</u><em>26℃</em></i>
            <i><u>前回から</u><em>4:20</em></i>
          </div>
          <div class="mp"><img src="images/IMG-03.png" alt=""></div>
          <div class="mj"><i class="w">まだ塗れない</i><i class="g">塗れる</i></div>
        </div>
      </div>
    </div>
    <button class="start" type="button" onclick="startDemo()">はじめる</button>
    <p class="sitefoot">北野塗装工業 ／ みどりが丘ハイツ 外壁改修</p>
  </div>
</section>

<section class="scr" id="s-faces">
  <div class="hd">
    <div class="t">みどりが丘ハイツ</div>
    <div class="hd-tools">
      <button type="button" class="role" onclick="switchRole()"><i class="role-i">田</i><b class="role-n">田中</b></button>
      <button type="button" class="to-entry" onclick="go('entry')">入口</button>
    </div>
  </div>
  <div class="pad">
    <div class="banner"><img src="images/IMG-07.png" alt=""></div>
    <div class="card" id="flist"></div>
  </div>
</section>

<section class="scr" id="s-record">
  <div class="hd">
    <button class="bk" type="button" onclick="go('faces')">‹</button>
    <div class="t">南面 2階<small>中塗り → 上塗り</small></div>
    <div class="hd-tools">
      <button type="button" class="role" onclick="switchRole()"><i class="role-i">田</i><b class="role-n">田中</b></button>
    </div>
  </div>
  <div class="pad" id="recordpad"></div>
</section>

<section class="scr" id="s-done">
  <div class="hd">
    <div class="t">南面 2階</div>
    <div class="hd-tools">
      <button type="button" class="role" onclick="switchRole()"><i class="role-i">田</i><b class="role-n">田中</b></button>
      <button type="button" class="to-entry" onclick="go('entry')">入口</button>
    </div>
  </div>
  <div class="pad" id="donepad"></div>
</section>

<section class="scr" id="s-know">
  <div class="hd">
    <div class="t">みどりが丘ハイツ</div>
    <div class="hd-tools">
      <button type="button" class="role" onclick="switchRole()"><i class="role-i">西</i><b class="role-n">西村</b></button>
      <button type="button" class="to-entry" onclick="go('entry')">入口</button>
    </div>
  </div>
  <div class="pad" id="knowpad"></div>
</section>

<section class="scr" id="s-bars">
  <div class="hd">
    <div class="t">面ごとの乾燥時間</div>
    <div class="hd-tools">
      <button type="button" class="role" onclick="switchRole()"><i class="role-i">西</i><b class="role-n">西村</b></button>
      <button type="button" class="to-entry" onclick="go('entry')">入口</button>
    </div>
  </div>
  <div class="pad" id="barspad"></div>
</section>

<div class="nav" id="nav"></div>
</div>

<script>
var REC_MODE = 'toggle'; /* 'toggle' | 'hold' */

var FACES = [
  { id:'S', name:'南面', unit:'M-S2', floor:'2階', process:'中塗り → 上塗り', last:'11:00', thumb:'images/IMG-08.png', today:true },
  { id:'E', name:'東面', unit:'M-E1', floor:'1階', process:'下塗り', last:'', thumb:'images/IMG-09.png', today:false },
  { id:'N', name:'北面', unit:'M-N3', floor:'3階', process:'中塗り 待ち', last:'', thumb:'images/IMG-10.png', today:false },
  { id:'W', name:'西面', unit:'M-W4', floor:'4階', process:'下塗り', last:'', thumb:'images/IMG-11.png', today:false }
];

var RECORDS = [
  { id:'R-20260418-003', face:'M-S1', waitMin:260, judge:'go',   result:'rework', photo:'images/IMG-06.png', temp:23, hum:62, subst:28,  voice:'触った感じは大丈夫。進める' },
  { id:'R-20260421-007', face:'M-E2', waitMin:310, judge:'go',   result:'ok',     photo:'images/IMG-03.png', temp:24, hum:60, subst:29,  voice:'東はもう乾いてる。行く' },
  { id:'R-20260425-011', face:'M-W3', waitMin:340, judge:'go',   result:'ok',     photo:'images/IMG-03.png', temp:21, hum:70, subst:null, voice:'温度計は下に置いてある。西は触って大丈夫だった' },
  { id:'R-20260508-009', face:'M-N3', waitMin:370, judge:'go',   result:'ok',     photo:'images/IMG-04.png', temp:22, hum:68, subst:24,  voice:'日が回ってきた。触っても指に付かない。行く' },
  { id:'R-20260502-004', face:'M-S3', waitMin:390, judge:'go',   result:'ok',     photo:'images/IMG-04.png', temp:22, hum:65, subst:27,  voice:'南はもう均一。30分見てから塗った' },
  { id:'R-20260506-006', face:'M-E1', waitMin:420, judge:'wait', result:'ok',     photo:'images/IMG-04.png', temp:20, hum:72, subst:23,  voice:'まだ少し冷たい。1時間見る' },
  { id:'R-20260510-012', face:'M-S4', waitMin:420, judge:'go',   result:'ok',     photo:'images/IMG-04.png', temp:23, hum:64, subst:27,  voice:'4階は乾きがいい。このくらいで揃う' },
  { id:'R-20260504-008', face:'M-W2', waitMin:440, judge:'wait', result:'ok',     photo:'images/IMG-04.png', temp:21, hum:71, subst:24,  voice:'西は午後から影。もう少し置く' },
  { id:'R-20260501-005', face:'M-N2', waitMin:450, judge:'wait', result:'ok',     photo:'images/IMG-04.png', temp:20, hum:74, subst:22,  voice:'北はまだ冷たい。触ると指に色が残る' },
  { id:'R-20260428-010', face:'M-N1', waitMin:480, judge:'wait', result:'ok',     photo:'images/IMG-05.png', temp:19, hum:75, subst:21,  voice:'1階の北は一日日が当たらない。夕方まで置く' },
  { id:'R-20260511-003', face:'M-N5', waitMin:540, judge:'wait', result:'ok',     photo:'images/IMG-05.png', temp:21, hum:69, subst:23,  voice:'上の階でも北は遅い。明日に回すか迷ったけど、今日のうちに塗る' },
  { id:'R-20260509-011', face:'M-N4', waitMin:570, judge:'wait', result:'ok',     photo:'images/IMG-04.png', temp:22, hum:68, subst:24,  voice:'数字は同じでも、北の影が残ってる。指で触るとまだ取れる。もう少し見る' }
];

var NOW = {
  id:'R-20260514-014', face:'M-S2', process:'中塗り → 上塗り',
  at:'2026-05-14 15:20', temp:22, hum:68, wind:'弱い', subst:26, elapsedMin:260,
  photo:'images/IMG-03.png',
  voice:'まだ指で触ると少し取れる。あと2時間見る'
};

var KNOWLEDGE = [{
  id:'K-P7',
  body:'この時期の北面は乾きが遅い。工程を組むときに北面を先に回すと、足場が1日縮む',
  n:34, medianNorth:7.5, medianOther:5.5,
  who:'西村', role:'工務', date:'2026/05/20'
}];

var OFFICE = { done:128, pending:6 };
var BARS = { S:5.5, E:5.5, N:7.5, W:5.5 };

var me='craft', flowStage=0, hasShot=false, hasVoice=false, recOn=false, recT=null, savedJudge='';
var qTouch='', qLight='', filteredRecords=[];

function waitFmt(min){
  var h=Math.floor(min/60), m=min%60;
  return h+':'+String(m).padStart(2,'0');
}

function layoutFor(id){
  var phone={faces:1, record:1, done:1};
  var view='entry';
  if(id==='entry') view='entry';
  else if(phone[id]) view='phone';
  else view='wide';
  document.body.setAttribute('data-view', view);
}

function go(id){
  layoutFor(id);
  document.querySelectorAll('.scr').forEach(function(e){e.classList.remove('on');});
  document.getElementById('s-'+id).classList.add('on');
  window.scrollTo(0,0);
  if(id==='faces') drawFaces();
  if(id==='record') drawRecord();
  if(id==='know') drawKnow();
  if(id==='bars') drawBars();
  paintNav(id);
  paintRole();
}

function startDemo(){
  me='craft';
  go('faces');
}
function switchRole(){
  if(me==='craft'){ me='office'; go('know'); }
  else { me='craft'; go('faces'); }
}
function paintRole(){
  var craft=me==='craft';
  document.querySelectorAll('.role-i').forEach(function(el){ el.textContent=craft?'田':'西'; });
  document.querySelectorAll('.role-n').forEach(function(el){ el.textContent=craft?'田中':'西村'; });
}

function paintNav(id){
  var n=document.getElementById('nav');
  if(id==='entry' || id==='record' || id==='done'){ n.className='nav'; n.innerHTML=''; return; }
  n.className='nav on';
  if(me==='craft'){
    n.innerHTML='<button class="sel" type="button" onclick="go(\'faces\')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>面</button>';
  }else{
    n.innerHTML=
      '<button class="'+(id==='know'?'sel':'')+'" type="button" onclick="go(\'know\')"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>記録</button>'+
      '<button class="'+(id==='bars'?'sel':'')+'" type="button" onclick="go(\'bars\')"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V6M16 19v-5M22 19H2"/></svg>面</button>';
  }
}

function drawFaces(){
  document.getElementById('flist').innerHTML=FACES.map(function(f){
    var last=f.last ? '前回 '+f.last : f.process;
    if(f.today){
      return '<button class="frow today" type="button" onclick="go(\'record\')">'+
        '<span class="fth"><img src="'+f.thumb+'" alt=""></span>'+
        '<span class="tx"><b>'+f.name+' '+f.floor+'</b><small>'+f.process+'　'+last+'</small></span>'+
        '<span class="pill">'+f.unit+'</span></button>';
    }
    return '<div class="frow off">'+
      '<span class="fth"><img src="'+f.thumb+'" alt=""></span>'+
      '<span class="tx"><b>'+f.name+' '+f.floor+'</b><small>'+f.process+'</small></span>'+
      '<span class="pill mute">'+f.unit+'</span></div>';
  }).join('');
}

function simStats(){
  var over=RECORDS.filter(function(r){return r.waitMin>=360;}).length;
  var sorted=RECORDS.map(function(r){return r.waitMin;}).slice().sort(function(a,b){return a-b;});
  var med=(sorted[5]+sorted[6])/2;
  var n3=RECORDS.filter(function(r){return r.face==='M-N3';})[0];
  var n4=RECORDS.filter(function(r){return r.face==='M-N4';})[0];
  return {n:RECORDS.length, over:over, med:waitFmt(med), n3:waitFmt(n3.waitMin), n4:waitFmt(n4.waitMin)};
}

function drawRecord(){
  hasShot=false; hasVoice=false; recOn=false; qTouch=''; qLight=''; filteredRecords=[]; clearTimeout(recT);
  var elapsed=waitFmt(NOW.elapsedMin);
  document.getElementById('recordpad').innerHTML=
    '<div class="metrics">'+
      '<div class="m"><span>気温</span><b>'+NOW.temp+'℃</b></div>'+
      '<div class="m"><span>湿度</span><b>'+NOW.hum+'%</b></div>'+
      '<div class="m"><span>素地</span><b>'+NOW.subst+'℃</b></div>'+
      '<div class="m"><span>経過</span><b>'+elapsed+'</b></div>'+
    '</div>'+
    '<p class="standard">塗料の表示 3時間以上</p>'+
    '<button class="shot" id="shot" type="button" onclick="takeShot()">'+
      '<span class="guide"></span><span style="position:relative;z-index:1;color:#fff;font-weight:700">写真を撮る</span>'+
    '</button>'+
    '<div id="questionArea"></div>'+
    '<div id="historyArea"></div>'+
    '<div class="micwrap">'+
      '<button class="mic" id="mic" type="button">'+micIcon()+'録音</button>'+
    '</div>'+
    '<div id="saidbox"></div>'+
    '<div class="judge">'+
      '<button class="wait" id="jwait" type="button" disabled onclick="saveJudge(\'wait\')">まだ塗れない</button>'+
      '<button class="go" id="jgo" type="button" disabled onclick="saveJudge(\'go\')">塗れる</button>'+
    '</div>';
  bindMic();
}

function micIcon(){
  return '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
}

function takeShot(){
  var s=document.getElementById('shot');
  if(s.classList.contains('has')) return;
  s.insertAdjacentHTML('afterbegin','<img src="'+NOW.photo+'" alt="">');
  s.classList.add('has');
  hasShot=true;
  renderQuestions();
  readyJudge();
}

function renderQuestions(){
  document.getElementById('questionArea').innerHTML=
    '<section class="questions" aria-label="確認">'+
      '<div class="question"><h3>指で触ると、色が指に付きますか</h3><small>5/9 M-N4 の記録から</small><div class="answers">'+
        '<button type="button" class="'+(qTouch==='付く'?'sel':'')+'" onclick="answerQuestion(\'touch\',\'付く\')">少し付く</button>'+
        '<button type="button" class="'+(qTouch==='付かない'?'sel':'')+'" onclick="answerQuestion(\'touch\',\'付かない\')">付かない</button>'+
      '</div></div>'+
      '<div class="question"><h3>この面に、いま日は当たっていますか</h3><small>北面の記録 34件から</small><div class="answers">'+
        '<button type="button" class="'+(qLight==='当たっている'?'sel':'')+'" onclick="answerQuestion(\'light\',\'当たっている\')">当たっている</button>'+
        '<button type="button" class="'+(qLight==='日陰'?'sel':'')+'" onclick="answerQuestion(\'light\',\'日陰\')">日陰</button>'+
      '</div></div>'+
    '</section>';
}

function answerQuestion(kind,value){
  if(kind==='touch') qTouch=value; else qLight=value;
  renderQuestions();
  if(qTouch && qLight){ filteredRecords=RECORDS.filter(function(r){
    var judgeOk=(qTouch==='付く' ? r.judge==='wait' : r.judge==='go');
    var faceOk=(qLight==='日陰' ? /^M-(N|W)/.test(r.face) : /^M-(S|E)/.test(r.face));
    return judgeOk && faceOk;
  }).sort(function(a,b){return b.waitMin-a.waitMin;}).slice(0,3);
  renderFilteredRecords();
  }
  readyJudge();
}

function renderFilteredRecords(){
  var note=[];
  if(filteredRecords.length && filteredRecords.every(function(r){return r.waitMin>=360;})) note.push('いずれも6時間以上あけています');
  if(filteredRecords.some(function(r){return r.result==='rework';})) note.push('うち1件は手直しになっています');
  document.getElementById('historyArea').innerHTML=
    '<section class="history" aria-labelledby="history-title">'+
      '<h3 id="history-title">絞られた記録 <small style="font-size:12px;color:var(--faint);font-weight:600">'+filteredRecords.length+'件</small></h3>'+
      (note.length ? '<div class="filter-note">'+note.join('<br>')+'</div>' : '')+
      '<div class="history-list">'+filteredRecords.map(function(r){
        var d=r.judge==='wait'?'まだ塗れない':'塗れる';
        return '<article class="history-card"><img src="'+r.photo+'" alt="'+r.face+'の記録写真" loading="lazy"><div class="hc-body"><div class="hc-meta">'+r.face+' ／ 前回から '+waitFmt(r.waitMin)+' ／ '+r.temp+'℃・'+r.hum+'%</div><div class="hc-decision '+r.judge+'">'+d+'</div><p>'+r.voice+'</p></div></article>';
      }).join('')+'</div>'+
    '</section>';
}

function bindMic(){
  var b=document.getElementById('mic');
  if(REC_MODE==='hold'){
    b.addEventListener('pointerdown', function(e){ e.preventDefault(); startRec(); });
    b.addEventListener('pointerup', stopRec);
    b.addEventListener('pointercancel', stopRec);
  }else{
    b.addEventListener('click', function(){ recOn ? stopRec() : startRec(); });
  }
}

function startRec(){
  if(recOn) return;
  recOn=true;
  var b=document.getElementById('mic');
  b.className='mic rec';
  b.innerHTML=micIcon()+'録音中';
  recT=setTimeout(stopRec, 4200);
}

function stopRec(){
  if(!recOn) return;
  recOn=false;
  clearTimeout(recT);
  var b=document.getElementById('mic');
  if(b){ b.className='mic'; b.innerHTML=micIcon()+'録音'; }
  document.getElementById('saidbox').innerHTML='<div class="said">'+NOW.voice+'</div>';
  hasVoice=true;
  readyJudge();
}

function readyJudge(){
  var ready=hasShot && qTouch && qLight;
  var w=document.getElementById('jwait'), g=document.getElementById('jgo');
  if(w) w.disabled=!ready;
  if(g) g.disabled=!ready;
}

function saveJudge(j){
  savedJudge=j; flowStage=1;
  renderDone();
  go('done');
}

function renderDone(){
  var label=savedJudge==='wait'?'まだ塗れない':'塗れる';
  var actual=flowStage>=2?'17:30に上塗り':'次の判断で確定';
  var result=flowStage>=3?'剥がれなし（5/15 08:10）':'翌朝に確認';
  var action=flowStage===1?'17:30の状態を見る':flowStage===2?'翌朝の結果を見る':'面一覧へ戻る';
  var click=flowStage<3?'advanceFlow()':'go(\'faces\')';
  document.getElementById('donepad').innerHTML=
    '<div class="done"><h2>'+ (flowStage===1?'判断を残しました':flowStage===2?'塗れる状態になりました':'結果を記録しました') +'</h2></div>'+ 
    '<div class="card" style="padding:6px 16px 10px">'+
      '<div class="slot"><div class="k">記録</div><div class="v">'+NOW.id+'</div></div>'+
      '<div class="slot"><div class="k">確認</div><div class="v">指に'+(qTouch==='付く'?'少し付く':'付かない')+' ／ '+qLight+'</div></div>'+
      '<div class="slot"><div class="k">判断</div><div class="v">'+label+'</div></div>'+
      '<div class="slot"><div class="k">実際</div><div class="v">'+actual+'</div></div>'+ 
      '<div class="slot"><div class="k">結果</div><div class="v">'+result+'</div></div>'+ 
    '</div>'+ 
    '<button class="back" type="button" onclick="'+click+'">'+action+'</button>';
}

function advanceFlow(){
  flowStage=Math.min(3,flowStage+1);
  if(flowStage===3){
    OFFICE.done+=1; OFFICE.pending=Math.max(0,OFFICE.pending-1);
    if(!RECORDS.some(function(r){return r.id===NOW.id;})) RECORDS.push({id:NOW.id,face:NOW.face,waitMin:NOW.elapsedMin+130,judge:savedJudge,result:'ok',photo:'images/IMG-05.png',temp:NOW.temp,hum:NOW.hum,subst:NOW.subst,voice:NOW.voice,touch:qTouch,light:qLight});
  }
  renderDone();
}

function drawKnow(){
  var k=KNOWLEDGE[0];
  document.getElementById('knowpad').innerHTML=
    '<div class="kpi">'+
      '<div class="k"><em>'+OFFICE.done+'</em><small>結果あり</small></div>'+
      '<div class="k"><em>'+OFFICE.pending+'</em><small>結果待ち</small></div>'+
    '</div>'+
    '<div class="card kncard">'+
      '<div class="meta"><b>'+k.id+'</b><span>'+k.who+'（'+k.role+'） '+k.date+'</span></div>'+
      '<p>'+k.body+'</p>'+
      '<div class="ev">根拠　北面 '+k.n+'件<br>乾燥時間の中央値　'+k.medianNorth+'時間（他の面は'+k.medianOther+'時間）</div>'+
    '</div>';
}

function drawBars(){
  var max=Math.max(BARS.S,BARS.E,BARS.N,BARS.W);
  var rows=[{id:'S',n:'南'},{id:'E',n:'東'},{id:'N',n:'北'},{id:'W',n:'西'}];
  document.getElementById('barspad').innerHTML='<div class="bars">'+rows.map(function(r){
    var v=BARS[r.id];
    var w=(v/max*100).toFixed(1);
    var north=r.id==='N'?' north':'';
    return '<div class="bar'+north+'"><div class="nm">'+r.n+'</div>'+
      '<div class="track"><i class="fill" style="width:'+w+'%"></i></div>'+
      '<div class="hr">'+v+'</div></div>';
  }).join('')+'</div>';
}
</script>
</body>
</html>
